name: web ci

on:
  pull_request:
    branches: [main]
permissions: 
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps: 
    - name: Checkout repository
      uses: actions/checkout@v7
      with: 
        persist-credentials: false 

    - name: Validate website files
      run: |
           test -s index.html
           test -s styles.css
