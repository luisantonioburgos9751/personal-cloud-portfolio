name: web ci

on:
  pull_request:
    branches: [main]
permissions: 
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps: 
    - name: Checkout repository
      uses: actions/checkout@v7
      with: 
        persist-credentials: false 

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Validate website files
      run: |
           test -s index.html
           test -s styles.css
      
    - name: Lint HTML
      run: npx --yes htmlhint@1.9.2 index.html

    - name: Install dependencies
      run: npm ci

    - name: Lint CSS
      run: npx stylelint styles.css